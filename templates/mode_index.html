<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Deine Modemarke | Kollektion Voting</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; background-color: #fafafa; color: #111; }
        header { text-align: center; padding: 40px 20px; background: white; border-bottom: 1px solid #eee; }
        header h1 { margin: 0; font-size: 32px; letter-spacing: 4px; text-transform: uppercase; }
        header p { color: #666; margin-top: 10px; }
        
        /* Layout für die Werbebanner */
        .werbung-banner { background: #f0f0f0; border: 1px dashed #bbb; text-align: center; padding: 20px; margin: 20px auto; max-width: 1000px; color: #888; font-size: 12px; }

        .galerie { display: flex; flex-wrap: wrap; justify-content: center; gap: 30px; padding: 40px 20px; max-width: 1200px; margin: 0 auto; }
        .produkt-karte { background: white; border: 1px solid #eee; border-radius: 8px; width: 300px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02); text-align: center; padding-bottom: 20px; }
        .produkt-karte img { width: 100%; height: 350px; object-fit: cover; }
        .produkt-karte h3 { font-size: 18px; margin: 15px 0 5px 0; text-transform: uppercase; letter-spacing: 1px; }
        .stimmen-zahl { color: #2196F3; font-weight: bold; margin-bottom: 15px; }
        
        .btn-vote { padding: 10px 20px; background: #111; color: white; border: none; border-radius: 4px; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: 0.2s; }
        .btn-vote:hover { background: #4CAF50; }
    </style>
</head>
<body>

    <header>
        <h1>LUCCIX CLOTHING</h1>
        <p>Vote now! Which items should we officially add to the shop?

</p>
    </header>

    <!-- Platzhalter für deine spätere Google-Werbung -->
    <div class="werbung-banner">
        [HIER WIRD DEINE GOOGLE ADSENSE WERBUNG ANGEZEIGT]
    </div>

    <div class="galerie">
        {% for id, info in klamotten.items() %}
        <div class="produkt-karte">
            <img src="{{ info.bild_url }}" alt="{{ info.name }}">
            <h3>{{ info.name }}</h3>
            <div class="stimmen-zahl">🔥 {{ info.stimmen }} Likes</div>
            
            <form action="/vote/{{ id }}" method="POST">
                <button type="submit" class="btn-vote">👍 i like it </button>
            </form>
        </div>
        {% endfor %}
    </div>

    <!-- Ein zweiter Werbebanner unten erhöht die Einnahmen -->
    <div class="werbung-banner">
        [HIER WIRD WEITERE WERBUNG ANGEZEIGT]
    </div>

</body>
</html>
