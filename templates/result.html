<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Dein Ergebnis</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        h2 { color: #4CAF50; }
        .daten { text-align: left; background: #f9f9f9; padding: 15px; border-radius: 4px; margin-top: 15px; border-left: 5px solid #4CAF50; }
        a { display: inline-block; margin-top: 20px; color: #0066cc; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hallo {{ name }}!</h2>
        <p>Deine Auswertung ist fertig:</p>
        
        <div class="daten">
            <p><strong>Alter:</strong> {{ alter }} Jahre</p>
            <p><strong>Herkunft:</strong> {{ herkunft }}</p>
            <p><strong>Dein Sternzeichen ist:</strong> <span style="font-size: 20px; color: #d32f2f;">{{ sternzeichen }}</span></p>
        </div>
        
        <a href="/">Zurück zur Eingabe</a>
    </div>
</body>
</html>
